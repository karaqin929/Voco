<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="280" r="180" fill="url(#glow)"/>

  <!-- Ears -->
  <circle cx="160" cy="195" r="35" fill="#2c1a1a"/>
  <circle cx="160" cy="195" r="18" fill="#f0c8a0"/>
  <circle cx="352" cy="195" r="35" fill="#2c1a1a"/>
  <circle cx="352" cy="195" r="18" fill="#f0c8a0"/>

  <!-- Head -->
  <circle cx="256" cy="260" r="90" fill="#2c1a1a"/>
  <circle cx="256" cy="260" r="82" fill="#f0c8a0"/>

  <!-- Big sparkly eyes -->
  <circle cx="228" cy="245" r="17" fill="white"/>
  <circle cx="228" cy="245" r="14" fill="#2c1a1a"/>
  <circle cx="228" cy="240" r="7" fill="white"/>
  <circle cx="224" cy="243" r="3.5" fill="white"/>
  <circle cx="231" cy="238" r="2" fill="white"/>

  <circle cx="284" cy="245" r="17" fill="white"/>
  <circle cx="284" cy="245" r="14" fill="#2c1a1a"/>
  <circle cx="284" cy="240" r="7" fill="white"/>
  <circle cx="280" cy="243" r="3.5" fill="white"/>
  <circle cx="287" cy="238" r="2" fill="white"/>

  <!-- Blush -->
  <ellipse cx="198" cy="268" rx="14" ry="8" fill="#ffaaaa" opacity="0.6"/>
  <ellipse cx="314" cy="268" rx="14" ry="8" fill="#ffaaaa" opacity="0.6"/>

  <!-- Nose -->
  <ellipse cx="256" cy="265" rx="7" ry="5" fill="#d4956b"/>

  <!-- Cute mouth -->
  <path d="M248 278 Q256 288 264 278" fill="none" stroke="#2c1a1a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="256" cy="380" rx="65" ry="45" fill="#2c1a1a"/>

  <!-- Speech bubble "Hi!" -->
  <rect x="310" y="160" width="90" height="50" rx="25" fill="#e94560" opacity="0.15"/>
  <rect x="310" y="160" width="90" height="50" rx="25" fill="none" stroke="#e94560" stroke-width="3"/>
  <text x="355" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#e94560">Hi!</text>
  <!-- Bubble tail -->
  <polygon points="330,208 310,230 320,210" fill="#e94560" opacity="0.15"/>
  <path d="M330 208 L310 230 L320 210" fill="none" stroke="#e94560" stroke-width="3" stroke-linejoin="round"/>

  <!-- Tiny paws holding a UK flag -->
  <ellipse cx="215" cy="395" rx="18" ry="14" fill="#f0c8a0"/>
  <ellipse cx="297" cy="395" rx="18" ry="14" fill="#f0c8a0"/>

  <!-- Small Union Jack -->
  <rect x="235" y="380" width="42" height="28" rx="3" fill="#1a3a6e"/>
  <line x1="235" y1="394" x2="277" y2="394" stroke="white" stroke-width="4" opacity="0.7"/>
  <line x1="256" y1="380" x2="256" y2="408" stroke="white" stroke-width="4" opacity="0.7"/>
  <line x1="239" y1="384" x2="273" y2="404" stroke="white" stroke-width="3" opacity="0.5"/>
  <line x1="273" y1="384" x2="239" y2="404" stroke="white" stroke-width="3" opacity="0.5"/>
  <rect x="235" y="380" width="42" height="28" rx="3" fill="none" stroke="#e94560" stroke-width="1.5"/>
</svg>

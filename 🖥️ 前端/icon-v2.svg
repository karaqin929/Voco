<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Sound waves (left side) -->
  <path d="M100 200 Q82 230 82 256 Q82 282 100 312" fill="none" stroke="#e94560" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <path d="M 78 175 Q55 218 55 256 Q55 294 78 337" fill="none" stroke="#e94560" stroke-width="8" stroke-linecap="round" opacity="0.3"/>

  <!-- Speech bubble (right side, larger) -->
  <path d="M300 120 Q390 120 390 200 L390 260 Q390 300 340 300 L290 300 L260 335 L260 300 L200 300 Q155 300 155 260 L155 200 Q155 120 200 120 Z"
        fill="none" stroke="#e94560" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Bear face inside bubble -->
  <!-- Ears -->
  <circle cx="230" cy="170" r="24" fill="#2c1810"/>
  <circle cx="230" cy="170" r="14" fill="#f5d6b8"/>
  <circle cx="300" cy="170" r="24" fill="#2c1810"/>
  <circle cx="300" cy="170" r="14" fill="#f5d6b8"/>

  <!-- Head -->
  <circle cx="265" cy="225" r="55" fill="#2c1810"/>
  <circle cx="265" cy="225" r="50" fill="#f5d6b8"/>

  <!-- Muzzle -->
  <ellipse cx="265" cy="245" rx="28" ry="20" fill="#fef0e0"/>

  <!-- Eyes -->
  <circle cx="247" cy="215" r="5" fill="#2c1810"/>
  <circle cx="247" cy="213" r="2" fill="white"/>
  <circle cx="283" cy="215" r="5" fill="#2c1810"/>
  <circle cx="283" cy="213" r="2" fill="white"/>

  <!-- Nose -->
  <ellipse cx="265" cy="235" rx="5.5" ry="4" fill="#2c1810"/>

  <!-- W mouth -->
  <path d="M258 243 Q262 247 265 243 Q268 247 272 243" fill="none" stroke="#2c1810" stroke-width="2" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="230" cy="238" rx="8" ry="5" fill="#ff9999" opacity="0.4"/>
  <ellipse cx="300" cy="238" rx="8" ry="5" fill="#ff9999" opacity="0.4"/>

  <!-- "V" monogram bottom center -->
  <text x="256" y="437" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="64" font-weight="900" fill="#e94560"
        letter-spacing="-2">V</text>
</svg>

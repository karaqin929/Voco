<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Voco</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FBF7F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ═══════════════════════════════ Login ═══════════════════════════════ -->
<div id="login-screen" style="display:none;">
  <div class="login-card">
    <div class="login-icon">🐻</div>
    <h1>Voco</h1>
    <p class="login-sub">追踪你的英语口语进步</p>
    <button id="btn-login" class="btn-login">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
      使用 Google 登录
    </button>
    <div class="login-divider"><span>或</span></div>
    <button id="btn-login-apple" class="btn-login btn-login-apple">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      使用 Apple 登录
    </button>
  </div>
</div>

<!-- ═══════════════════════════════ Main App ═══════════════════════════ -->
<div id="app-main" style="display:none;">
  <header class="app-header">
    <span class="app-title">Voco</span>
    <button id="btn-logout" class="btn-logout">退出</button>
  </header>

  <!-- ── Tab: Home ────────────────────────────── -->
  <section id="tab-home" class="tab-content active">

    <!-- Import Card (collapsible) -->
    <div class="import-card" id="import-card">
      <div class="import-header" id="import-toggle">
        <span>📥 导入日报</span>
        <span class="import-chevron" id="import-chevron">›</span>
      </div>
      <div class="import-body" id="import-body" style="display:none;">
        <textarea id="report-input" placeholder="将 ChatGPT 生成的日报粘贴到这里..."></textarea>
        <button id="btn-submit" class="btn-primary">解析入库</button>
        <div id="import-result"></div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="calendar-header">
      <span class="cal-month" id="cal-month-label"></span>
      <div class="cal-legend">
        <span class="cal-legend-dot" style="background:var(--cal-empty)"></span>少
        <span class="cal-legend-dot" style="background:var(--cal-l1)"></span>
        <span class="cal-legend-dot" style="background:var(--cal-l2)"></span>
        <span class="cal-legend-dot" style="background:var(--cal-l3)"></span>
        <span class="cal-legend-dot" style="background:var(--cal-l4)"></span>多
      </div>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card sessions">
        <div class="stat-num" id="stat-sessions">0</div>
        <div class="stat-label">次练习</div>
      </div>
      <div class="stat-card vocab">
        <div class="stat-num" id="stat-vocab">0</div>
        <div class="stat-label">个单词</div>
      </div>
      <div class="stat-card errors">
        <div class="stat-num" id="stat-errors">0</div>
        <div class="stat-label">条纠正</div>
      </div>
      <div class="stat-card streak">
        <div class="stat-num" id="stat-streak">0</div>
        <div class="stat-label">天坚持</div>
      </div>
    </div>

    <!-- Today's Topic CTA -->
    <div class="topic-card" id="topic-cta">
      <div class="topic-icon">💬</div>
      <div class="topic-info">
        <div class="topic-label">Ready to practice?</div>
        <div class="topic-name" id="topic-name">今日话题</div>
        <div class="topic-sub" id="topic-sub"></div>
      </div>
      <button class="topic-go" id="topic-go-btn">GO</button>
    </div>

    <!-- Duration stat -->
    <div class="duration-bar" id="duration-bar" style="display:none;">
      <span>⏱️ 总练习</span>
      <span id="stat-duration">0 分钟</span>
    </div>

    <!-- Dual Cards: Errors + Review -->
    <div class="dual-cards">
      <div class="dual-card">
        <div class="dual-title">🔧 最近错误</div>
        <div id="recent-errors"><div class="dual-empty">导入日报后自动显示 ✨</div></div>
      </div>
      <div class="dual-card">
        <div class="dual-title">📝 待复习</div>
        <div id="review-queue"><div class="dual-empty">导入日报后自动显示 ✨</div></div>
      </div>
    </div>
  </section>

  <!-- ── Tab: Library ──────────────────────────── -->
  <section id="tab-library" class="tab-content">
    <div class="lib-search-wrap">
      <span class="lib-search-icon">🔍</span>
      <input id="lib-search" class="lib-search" type="text" placeholder="搜索...">
    </div>
    <div class="lib-tabs">
      <button class="lib-tab active" data-lib="vocab">单词 <span class="lib-count" id="lib-count-vocab"></span></button>
      <button class="lib-tab" data-lib="errors">纠错 <span class="lib-count" id="lib-count-errors"></span></button>
      <button class="lib-tab" data-lib="patterns">句型 <span class="lib-count" id="lib-count-patterns"></span></button>
    </div>
    <div class="lib-subtabs" id="lib-subtabs" style="display:none;"></div>
    <div id="library-content" class="loading">加载中...</div>
  </section>

  <!-- ── Tab: Settings ─────────────────────────── -->
  <section id="tab-settings" class="tab-content">

    <div class="settings-group">
      <div class="settings-group-label">👤 账号</div>
      <div class="settings-item">
        <span class="settings-item-label">邮箱</span>
        <span class="settings-item-value" id="settings-email">---</span>
      </div>
      <div class="settings-item settings-item-danger" id="btn-logout-settings">
        <span>退出登录</span>
        <span class="settings-arrow">›</span>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-label">🎨 外观</div>
      <div class="settings-item">
        <span class="settings-item-label">App 名称</span>
        <input id="setting-name" class="settings-input" placeholder="Voco" />
      </div>
      <div class="settings-item" id="btn-save-name">
        <span>保存设置</span>
        <span class="settings-arrow">›</span>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-label">📊 数据</div>
      <div class="settings-item">
        <span class="settings-item-label">导出数据</span>
        <span class="settings-item-hint">即将推出</span>
      </div>
      <div class="settings-item settings-item-danger">
        <span>清除所有数据</span>
        <span class="settings-item-hint">不可恢复</span>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-label">📈 学习趋势</div>
      <div id="settings-trends"><div class="loading">加载中...</div></div>
    </div>

    <div class="settings-footer">
      <span>Voco</span>
      <span class="settings-version">v1.0</span>
    </div>
  </section>

  <!-- ── Tab Bar ──────────────────────────────── -->
  <nav class="tab-bar">
    <button class="tab active" data-tab="home">🏠 首页</button>
    <button class="tab" data-tab="library">📚 词汇</button>
    <button class="tab" data-tab="settings">⚙️ 设置</button>
  </nav>
</div>

<script src="/supabase-client.js"></script>
<script src="/parser.js"></script>
<script src="/app.js"></script>
</body>
</html>

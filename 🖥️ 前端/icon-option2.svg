<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Headphones band -->
  <path d="M170 270 Q255 230 340 270" fill="none" stroke="#e94560" stroke-width="10" stroke-linecap="round"/>
  <path d="M170 270 Q255 240 340 270" fill="none" stroke="#c0392b" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- Headphones cups -->
  <rect x="135" y="280" width="40" height="55" rx="20" fill="#e94560"/>
  <rect x="335" y="280" width="40" height="55" rx="20" fill="#e94560"/>
  <!-- Inner cups -->
  <rect x="142" y="288" width="26" height="39" rx="13" fill="#c0392b"/>
  <rect x="342" y="288" width="26" height="39" rx="13" fill="#c0392b"/>

  <!-- Mic arm -->
  <path d="M200 330 Q185 370 170 390 Q160 405 175 410" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <!-- Mic -->
  <ellipse cx="175" cy="415" rx="12" ry="16" fill="#e94560"/>
  <rect x="169" y="398" width="12" height="8" rx="3" fill="#555"/>

  <!-- Bear ears -->
  <circle cx="175" cy="230" r="28" fill="#2c1a1a"/>
  <circle cx="175" cy="230" r="14" fill="#deab7a"/>
  <circle cx="335" cy="230" r="28" fill="#2c1a1a"/>
  <circle cx="335" cy="230" r="14" fill="#deab7a"/>

  <!-- Head -->
  <circle cx="255" cy="290" r="72" fill="#2c1a1a"/>
  <circle cx="255" cy="290" r="65" fill="#deab7a"/>

  <!-- Eyes - happy squinting (talking/listening) -->
  <path d="M215 280 Q225 268 235 280" fill="none" stroke="#2c1a1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M275 280 Q285 268 295 280" fill="none" stroke="#2c1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="200" cy="298" rx="10" ry="6" fill="#ff8888" opacity="0.4"/>
  <ellipse cx="310" cy="298" rx="10" ry="6" fill="#ff8888" opacity="0.4"/>

  <!-- Nose -->
  <ellipse cx="255" cy="298" rx="6" ry="4.5" fill="#c07850"/>

  <!-- Smile -->
  <path d="M238 310 Q255 325 272 310" fill="none" stroke="#2c1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="255" cy="395" rx="60" ry="40" fill="#2c1a1a"/>
  <!-- Collar/shirt detail -->
  <path d="M220 365 L255 390 L290 365" fill="none" stroke="#e94560" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tiny "EN" badge -->
  <circle cx="310" cy="340" r="18" fill="#e94560"/>
  <text x="310" y="347" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="900" fill="white">EN</text>
</svg>

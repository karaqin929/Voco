<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Glow behind bear -->
  <circle cx="256" cy="250" r="130" fill="#e94560" opacity="0.06"/>

  <!-- Bear emoji -->
  <text x="256" y="280" text-anchor="middle"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
        font-size="190">🐻</text>

  <!-- Speech bubble -->
  <rect x="320" y="140" width="80" height="44" rx="22" fill="#e94560" opacity="0.92"/>
  <text x="360" y="168" text-anchor="middle"
        font-family="system-ui, sans-serif"
        font-size="17" font-weight="800" fill="white">Hi!</text>
  <polygon points="338,181 320,195 348,184" fill="#e94560" opacity="0.92"/>

  <!-- Small UK flag -->
  <g transform="translate(376, 328)">
    <rect x="0" y="0" width="36" height="24" rx="3" fill="#1a3a6e"/>
    <line x1="0" y1="12" x2="36" y2="12" stroke="white" stroke-width="3.5" opacity="0.6"/>
    <line x1="18" y1="0" x2="18" y2="24" stroke="white" stroke-width="3.5" opacity="0.6"/>
    <line x1="1" y1="2" x2="35" y2="22" stroke="white" stroke-width="2.5" opacity="0.4"/>
    <line x1="35" y1="2" x2="1" y2="22" stroke="white" stroke-width="2.5" opacity="0.4"/>
  </g>
</svg>

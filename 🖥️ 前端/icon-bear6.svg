<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle circle behind emoji -->
  <circle cx="256" cy="240" r="140" fill="#e94560" opacity="0.08"/>

  <!-- Bear emoji large -->
  <text x="256" y="270" text-anchor="middle"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
        font-size="200"
        filter="url(#shadow)">🐻</text>

  <!-- Small "EN" badge bottom -->
  <circle cx="256" cy="410" r="24" fill="#e94560" opacity="0.9"/>
  <text x="256" y="418" text-anchor="middle"
        font-family="system-ui, sans-serif"
        font-size="18" font-weight="900" fill="white">EN</text>
</svg>

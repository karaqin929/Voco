<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="#1a1a2e"/>
  <circle cx="256" cy="260" r="200" fill="url(#glow)"/>

  <!-- Ear left -->
  <circle cx="176" cy="154" r="40" fill="#3d1c0a"/>

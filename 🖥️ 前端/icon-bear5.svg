  <!-- Ear right -->
  <circle cx="336" cy="154" r="40" fill="#3d1c0a"/>
  <circle cx="336" cy="154" r="24" fill="#fde4cf"/>

  <!-- Head shadow -->
  <circle cx="256" cy="265" r="112" fill="#3d1c0a"/>
  <!-- Head -->
  <circle cx="256" cy="260" r="108" fill="#fde4cf"/>

  <!-- Eye left -->

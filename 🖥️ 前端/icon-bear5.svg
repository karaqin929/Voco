  <circle cx="225" cy="245" r="2.5" fill="white"/>

  <!-- Eye right -->
  <circle cx="286" cy="248" r="7" fill="#3d1c0a"/>
  <circle cx="285" cy="245" r="2.5" fill="white"/>

  <!-- Nose -->

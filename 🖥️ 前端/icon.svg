<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Speech bubble -->
  <path d="M290 90 Q355 90 355 150 V200 Q355 240 310 240 H260 L235 265 L235 240 H195 Q155 240 155 200 V150 Q155 90 195 90 Z"
        fill="#2d2d5e" stroke="#e94560" stroke-width="4"/>
  <text x="255" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#e94560">Hello!</text>
  <!-- Small tail of speech bubble pointing to bear -->
  <polygon points="235,265 250,290 265,265" fill="#2d2d5e" stroke="#e94560" stroke-width="3"/>

  <!-- Bear ears -->
  <circle cx="170" cy="310" r="32" fill="#2c1a1a"/>
  <circle cx="170" cy="310" r="16" fill="#e8b88a"/>
  <circle cx="340" cy="310" r="32" fill="#2c1a1a"/>
  <circle cx="340" cy="310" r="16" fill="#e8b88a"/>

  <!-- Bear head -->
  <circle cx="255" cy="370" r="80" fill="#2c1a1a"/>
  <circle cx="255" cy="370" r="72" fill="#e8b88a"/>

  <!-- Big cute eyes -->
  <circle cx="230" cy="355" r="14" fill="#2c1a1a"/>
  <circle cx="230" cy="350" r="6" fill="white"/>
  <circle cx="232" cy="353" r="2.5" fill="white"/>

  <circle cx="280" cy="355" r="14" fill="#2c1a1a"/>
  <circle cx="280" cy="350" r="6" fill="white"/>
  <circle cx="282" cy="353" r="2.5" fill="white"/>

  <!-- Blush -->
  <ellipse cx="205" cy="375" rx="12" ry="7" fill="#ff9999" opacity="0.5"/>
  <ellipse cx="305" cy="375" rx="12" ry="7" fill="#ff9999" opacity="0.5"/>

  <!-- Nose -->
  <ellipse cx="255" cy="375" rx="7" ry="5" fill="#c07850"/>

  <!-- Cute open mouth (talking) -->
  <ellipse cx="242" cy="392" rx="8" ry="5" fill="#2c1a1a"/>
  <ellipse cx="268" cy="392" rx="8" ry="5" fill="#2c1a1a"/>
  <path d="M242 392 Q255 405 268 392" fill="#2c1a1a"/>
  <rect x="242" y="388" width="26" height="10" rx="4" fill="#2c1a1a"/>

  <!-- Body -->
  <ellipse cx="255" cy="460" rx="60" ry="35" fill="#2c1a1a"/>
</svg>

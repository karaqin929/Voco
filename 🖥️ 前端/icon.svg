<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Ears -->
  <circle cx="155" cy="145" r="45" fill="#2c1a1a"/>
  <circle cx="155" cy="145" r="25" fill="#d4956b"/>
  <circle cx="357" cy="145" r="45" fill="#2c1a1a"/>
  <circle cx="357" cy="145" r="25" fill="#d4956b"/>

  <!-- Head -->
  <circle cx="256" cy="240" r="110" fill="#2c1a1a"/>
  <circle cx="256" cy="240" r="100" fill="#d4956b"/>

  <!-- Inner face -->
  <ellipse cx="256" cy="270" rx="60" ry="50" fill="#f0c8a0"/>

  <!-- Eyes -->
  <circle cx="225" cy="225" r="10" fill="#2c1a1a"/>
  <circle cx="225" cy="222" r="3" fill="white"/>
  <circle cx="287" cy="225" r="10" fill="#2c1a1a"/>
  <circle cx="287" cy="222" r="3" fill="white"/>

  <!-- Glasses -->
  <rect x="201" y="213" width="48" height="30" rx="6" fill="none" stroke="#e94560" stroke-width="4"/>
  <rect x="263" y="213" width="48" height="30" rx="6" fill="none" stroke="#e94560" stroke-width="4"/>
  <line x1="249" y1="228" x2="263" y2="228" stroke="#e94560" stroke-width="4"/>

  <!-- Nose -->
  <ellipse cx="256" cy="250" rx="8" ry="6" fill="#c07850"/>

  <!-- Mouth (smile) -->
  <path d="M235 268 Q256 285 277 268" fill="none" stroke="#2c1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Body -->
  <path d="M180 340 Q180 310 210 310 H300 Q330 310 330 340 V420 Q330 440 300 440 H210 Q180 440 180 420 Z" fill="#2c1a1a"/>

  <!-- Book -->
  <rect x="200" y="350" width="110" height="75" rx="5" fill="#1a4a7a"/>
  <rect x="200" y="350" width="55" height="75" rx="5" fill="#2563a0"/>
  <line x1="255" y1="350" x2="255" y2="425" stroke="#e94560" stroke-width="3"/>

  <!-- Book lines -->
  <line x1="215" y1="368" x2="245" y2="368" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="215" y1="380" x2="245" y2="380" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="215" y1="392" x2="240" y2="392" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="260" y1="368" x2="300" y2="368" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="260" y1="380" x2="295" y2="380" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="260" y1="392" x2="290" y2="392" stroke="white" stroke-width="2.5" opacity="0.5"/>

  <!-- "ABC" on book -->
  <text x="228" y="415" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e94560">ABC</text>
</svg>

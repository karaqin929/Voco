<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Ears -->
  <circle cx="175" cy="135" r="38" fill="#2c1810"/>
  <circle cx="175" cy="135" r="22" fill="#f5d6b8"/>
  <circle cx="337" cy="135" r="38" fill="#2c1810"/>
  <circle cx="337" cy="135" r="22" fill="#f5d6b8"/>

  <!-- Head -->
  <circle cx="256" cy="260" r="105" fill="#2c1810"/>
  <circle cx="256" cy="260" r="98" fill="#f5d6b8"/>

  <!-- Muzzle (lighter area) -->
  <ellipse cx="256" cy="295" rx="52" ry="38" fill="#fef0e0"/>

  <!-- Eyes - simple dots -->
  <circle cx="225" cy="245" r="9" fill="#2c1810"/>
  <circle cx="225" cy="242" r="3.5" fill="white"/>
  <circle cx="287" cy="245" r="9" fill="#2c1810"/>
  <circle cx="287" cy="242" r="3.5" fill="white"/>

  <!-- Nose -->
  <ellipse cx="256" cy="278" rx="10" ry="7" fill="#2c1810"/>
  <ellipse cx="253" cy="275" rx="3" ry="2" fill="white" opacity="0.6"/>

  <!-- Mouth - tiny W -->
  <path d="M245 292 Q250 298 256 292 Q262 298 267 292" fill="none" stroke="#2c1810" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cheek blush -->
  <ellipse cx="195" cy="280" rx="15" ry="9" fill="#ff9999" opacity="0.5"/>
  <ellipse cx="317" cy="280" rx="15" ry="9" fill="#ff9999" opacity="0.5"/>

  <!-- Body -->
  <ellipse cx="256" cy="410" rx="70" ry="50" fill="#2c1810"/>

  <!-- Simple speech bubble -->
  <rect x="320" y="130" width="70" height="40" rx="20" fill="#e94560" opacity="0.9"/>
  <text x="355" y="157" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="white">Hi!</text>
  <polygon points="330,168 318,185 340,170" fill="#e94560" opacity="0.9"/>

  <!-- Tiny EN badge on chest -->
  <circle cx="256" cy="415" r="16" fill="#e94560"/>
  <text x="256" y="421" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="900" fill="white">EN</text>
</svg>

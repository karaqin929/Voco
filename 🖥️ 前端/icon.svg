<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="faceGrad" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F2F5"/>
    </radialGradient>
  </defs>

  <!-- Cream bg — LingoTrace style -->
  <rect width="512" height="512" rx="120" fill="#F8F7F2"/>

  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="116" fill="none" stroke="#E8E5DC" stroke-width="3"/>

  <!-- Bear head — minimal line-art style -->
  <circle cx="256" cy="275" r="140" fill="url(#faceGrad)" stroke="#5B7FAD" stroke-width="7"/>

  <!-- Ears -->
  <circle cx="150" cy="170" r="42" fill="url(#faceGrad)" stroke="#5B7FAD" stroke-width="7"/>
  <circle cx="362" cy="170" r="42" fill="url(#faceGrad)" stroke="#5B7FAD" stroke-width="7"/>
  <!-- Inner ears -->
  <circle cx="150" cy="170" r="20" fill="#D0DDEB"/>
  <circle cx="362" cy="170" r="20" fill="#D0DDEB"/>

  <!-- Eyes — hand-drawn style: slightly irregular -->
  <ellipse cx="208" cy="258" rx="13" ry="15" fill="#3A5A80"/>
  <ellipse cx="304" cy="258" rx="13" ry="15" fill="#3A5A80"/>
  <!-- Eye highlights -->
  <circle cx="213" cy="252" r="4.5" fill="#FFFFFF"/>
  <circle cx="309" cy="252" r="4.5" fill="#FFFFFF"/>

  <!-- Nose -->
  <ellipse cx="256" cy="298" rx="12" ry="9" fill="#3A5A80"/>

  <!-- Mouth — hand-drawn curve -->
  <path d="M230 322 Q256 340 282 322" fill="none" stroke="#3A5A80" stroke-width="5" stroke-linecap="round"/>

  <!-- Speech indicator — subtle blue arc -->
  <path d="M390 200 Q450 260 390 320" fill="none" stroke="#7AA0C0" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M410 180 Q480 260 410 340" fill="none" stroke="#7AA0C0" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
</svg>
